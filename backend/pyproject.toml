[project]
name = "business-research-copilot"
version = "0.1.0"
description = "FastAPI backend for Business Research Copilot, powered by LangGraph, OpenAI, and Memori"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.3",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "duckduckgo-search>=6.1.7",
    "openai>=1.35.3",
    "langchain>=0.2.6",
    "langchain-openai>=0.1.9",
    "langgraph>=0.1.4",
    "memori>=0.1.18",
    "pytest>=8.2.2"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2"
]

[tool.pyright]
venvPath = "."
venv = ".venv"

